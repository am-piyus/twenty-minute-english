<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Twenty Minute English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* One quiet column, one step per screen, one accent. */
:root{
  --bg:#FAFAFB; --surface:#FFFFFF; --ink:#16181F; --muted:#6B7080; --line:#E4E6EC;
  --accent:#3046D6; --on-accent:#FFFFFF; --good:#1A7F52; --bad:#C23347; --soft:#F1F2F6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111217; --surface:#1A1C23; --ink:#ECEDF2; --muted:#9A9FB0; --line:#2B2E38;
  --accent:#8FA0FF; --on-accent:#111217; --good:#5BD19C; --bad:#FF8597; --soft:#20232B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111217; --surface:#1A1C23; --ink:#ECEDF2; --muted:#9A9FB0; --line:#2B2E38;
  --accent:#8FA0FF; --on-accent:#111217; --good:#5BD19C; --bad:#FF8597; --soft:#20232B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);height:3px;background:var(--line);z-index:2}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
main{max-width:520px;margin:0 auto;padding-inline:20px;padding-block:40px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.4rem}
h2{font-size:1.7rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:12px;padding:15px 20px;font:700 1rem/1 var(--body);background:var(--accent);color:var(--on-accent);width:100%}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.name{all:unset;cursor:pointer;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:34px 10px;font:700 1.4rem/1 var(--display)}
.name:hover{border-color:var(--accent)}
ol.plan{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.clock{font:700 4.2rem/1 var(--display);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em}
.topic{font:700 1.5rem/1.2 var(--display);text-align:center}
.wheel{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.wheel canvas{width:100%;height:100%;display:block;border-radius:50%;transition:transform 4s cubic-bezier(.15,.85,.2,1)}
.wheel::after{content:"";position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:10px solid transparent;border-top:16px solid var(--accent)}
.mic{all:unset;cursor:pointer;width:112px;height:112px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 1rem/1 var(--body)}
.mic.on{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--bad) 20%,transparent)}}}
@media (prefers-reduced-motion:reduce){.wheel canvas{transition:none}}
.rule{border-left:3px solid var(--accent);padding-left:14px;display:flex;flex-direction:column;gap:6px}
.ex p{margin:0}
.ex .no{color:var(--bad);text-decoration:line-through}
.ex .yes{color:var(--good)}
.q{font-size:1.15rem;font-weight:700}
.kind{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 15px}
.opt.right,.chip.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.wrong,.chip.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.tray{min-height:50px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
textarea{min-height:120px;resize:vertical}
.fb{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}
.center{text-align:center}
</style>
</head>
<body>
<div class="bar"><i id="bar" style="width:0"></i></div>
<main id="app"></main>
<script>
const SB_URL='https://tyusfrpcqeholwwfkvzb.supabase.co', SB_KEY='sb_publishable_VHtdUZlWKyQIIBr_pXpqjg_Qs0Z5aPD';
const SETS = {
constitution: [
 {t:"mcq", kind:"Past or present perfect", q:"The Constituent Assembly ___ the Constitution on 26 November 1949.",
  o:["has adopted","adopted","have adopted","adopts"], a:1,
  why:"“On 26 November 1949” is a finished time, so use the simple past: adopted."},
 {t:"fill", kind:"Since or for", q:"India has been a republic ___ 1950.", acc:["since"],
  why:"Since + a starting point (1950). For + a length of time (for 75 years)."},
 {t:"fill", kind:"Articles", q:"Dr B. R. Ambedkar was ___ chairman of the Drafting Committee.", acc:["the"],
  why:"There was only one chairman, so it is the chairman."},
 {t:"fill", kind:"Prepositions", q:"Fundamental Rights are given ___ Part III of the Constitution.", acc:["in"],
  why:"Something is written in a part, chapter or article."},
 {t:"mcq", kind:"Subject–verb agreement", q:"The list of Fundamental Duties ___ in Article 51A.",
  o:["are given","is given","were giving","be given"], a:1,
  why:"The subject is “the list” (one list), not “duties”. One list is given."},
 {t:"error", kind:"Spot the error", q:"Tap the part that is wrong.",
  parts:["Parliament","have passed","more than","a hundred amendments."], a:1, fix:"has passed",
  why:"Parliament is one body, so it takes has: Parliament has passed."},
 {t:"fill", kind:"Correct the sentence", q:"Rewrite it correctly: “She don't know the difference between rights and duties.”",
  acc:["she doesn't know the difference between rights and duties","she does not know the difference between rights and duties"],
  why:"She, he and it take does: She doesn't know…"},
 {t:"mcq", kind:"Active to passive", q:"Active: “The President appoints the Chief Justice of India.” Which passive is correct?",
  o:["The Chief Justice of India was appointed by the President.","The Chief Justice of India is appointed by the President.","The Chief Justice of India has appointed the President.","The Chief Justice of India is appoint by the President."], a:1,
  why:"Keep the tense: appoints (present) becomes is appointed."},
 {t:"mcq", kind:"Reported speech", q:"She said, “I am reading Article 21.” Report it.",
  o:["She said that she is reading Article 21.","She said that I was reading Article 21.","She said that she was reading Article 21.","She said that she has read Article 21."], a:2,
  why:"After “said”, am reading moves back to was reading, and I becomes she."},
 {t:"order", kind:"Word order", words:["Article 21","protects","the right","to life","and personal liberty"],
  why:"Subject, then verb, then object: Article 21 protects the right to life and personal liberty."},
 {t:"mcq", kind:"Making questions", q:"Which question is correct?",
  o:["When the Constitution was adopted?","When did the Constitution adopted?","When was the Constitution adopted?","When was adopted the Constitution?"], a:2,
  why:"In a question, the helping verb comes before the subject: When was the Constitution adopted?"},
 {t:"fill", kind:"Conditionals", q:"If citizens ___ (know) their rights, they would protect them better.", acc:["knew"],
  why:"If + past, would + verb. This is an imagined situation: If citizens knew…"},
 {t:"fill", kind:"Comparing", q:"India has ___ (long) written constitution in the world.", acc:["the longest"],
  why:"Comparing with everything else in the world: the + -est. The longest."},
 {t:"mcq", kind:"Word choice", q:"The Constitution came into ___ on 26 January 1950.",
  o:["force","power","work","strength"], a:0,
  why:"A law comes into force. That is the fixed phrase."},
 {t:"write", kind:"Write it yourself",
  q:"Write 2 sentences. One about something that has continued since 1950, using has or have. One about something that happened on a fixed date, using the simple past.",
  model:"India has held many general elections since 1950. The first general election began in October 1951.",
  why:"Use has/have + past participle for a period that reaches today, and the simple past for a finished date."}
],
engineering: [
 {t:"mcq", kind:"Past or present perfect", q:"I ___ my first PCB design last year.",
  o:["have finished","finished","have finish","finish"], a:1,
  why:"“Last year” is a finished time, so use the simple past: finished."},
 {t:"fill", kind:"Since or for", q:"We have tested this circuit ___ three hours.", acc:["for"],
  why:"For + a length of time (three hours). Since + a starting point (since 10 a.m.)."},
 {t:"fill", kind:"Articles", q:"An engineer needs ___ oscilloscope to see the signal.", acc:["an"],
  why:"Oscilloscope starts with a vowel sound, so it is an oscilloscope."},
 {t:"fill", kind:"Prepositions", q:"The sensor is connected ___ the microcontroller.", acc:["to"],
  why:"One thing is connected to another."},
 {t:"mcq", kind:"Subject–verb agreement", q:"Each of the resistors ___ a different value.",
  o:["have","has","are having","having"], a:1,
  why:"“Each” means one at a time, so it takes has."},
 {t:"error", kind:"Spot the error", q:"Tap the part that is wrong.",
  parts:["The readings","from the sensor","are sended","to the laptop."], a:2, fix:"are sent",
  why:"Send is irregular: send, sent, sent. There is no word “sended”."},
 {t:"fill", kind:"Correct the sentence", q:"Rewrite it correctly: “He have finished the code yesterday.”",
  acc:["he finished the code yesterday"],
  why:"“Yesterday” is a finished time, so use the simple past. Present perfect never goes with yesterday."},
 {t:"mcq", kind:"Active to passive", q:"Active: “Engineers designed this bridge in 1998.” Which passive is correct?",
  o:["This bridge is designed by engineers in 1998.","This bridge has been designed by engineers in 1998.","This bridge was designed by engineers in 1998.","This bridge was design by engineers in 1998."], a:2,
  why:"Keep the tense: designed (past) becomes was designed."},
 {t:"mcq", kind:"Reported speech", q:"He said, “I am fixing the bug.” Report it.",
  o:["He said that he is fixing the bug.","He said that I was fixing the bug.","He said that he was fixing the bug.","He said that he has fixed the bug."], a:2,
  why:"After “said”, am fixing moves back to was fixing, and I becomes he."},
 {t:"order", kind:"Word order", words:["The motor","stopped","because","the battery","was","empty"],
  why:"Main clause first, then the reason: The motor stopped because the battery was empty."},
 {t:"mcq", kind:"Making questions", q:"Which question is correct?",
  o:["How this sensor works?","How does this sensor works?","How does this sensor work?","How is this sensor work?"], a:2,
  why:"Does carries the -s, so the main verb stays plain: How does this sensor work?"},
 {t:"fill", kind:"Conditionals", q:"If you increase the voltage, the current ___ (increase).", acc:["increases","will increase"],
  why:"A fact that is always true: If + present, present. The current increases."},
 {t:"fill", kind:"Comparing", q:"Copper is one of ___ (good) conductors of electricity.", acc:["the best"],
  why:"Good, better, the best. “One of the …” always takes the superlative."},
 {t:"mcq", kind:"Word choice", q:"Please ___ the experiment again and note the readings.",
  o:["carry out","make","take","give"], a:0,
  why:"You carry out (or do) an experiment. You don't make one."},
 {t:"write", kind:"Write it yourself",
  q:"Write 2 sentences. One about something you have built or learned this year, using has or have. One about something you did on a fixed day, using the simple past.",
  model:"I have built a voice note app this year. Last Sunday I tested it on my phone.",
  why:"Use has/have + past participle for a period that reaches today, and the simple past for a finished day."}
]};
const SETFOR = {archita:"constitution", piyus:"engineering"};
const NAMES = {piyus:"Piyus", archita:"Archita"};
const TOPICS = ["The Constitution","Engineering","Technology","Environment","Education","Health","Sports","Films","Food","Travel","Social media","My hometown"];
const STEPS = 9;

let S = {step:0, who:null, topic:null, qi:0, ans:{}, writing:"", sent:false, stamp:null};
const KEY="tme2";
const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
try{ const v=JSON.parse(localStorage.getItem(KEY)||"null"); if(v && v.stamp===today()) S=Object.assign(S,v); }catch(e){}
function today(){ return new Date().toLocaleDateString("en-CA"); }

const $=(t,a={},k=[])=>{ const e=document.createElement(t); for(const [x,v] of Object.entries(a)){ if(x==="text") e.textContent=v; else if(x==="on") for(const [ev,f] of Object.entries(v)) e.addEventListener(ev,f); else if(v!==false&&v!=null) e.setAttribute(x,v===true?"":v); } for(const c of [].concat(k)) if(c!=null) e.append(c); return e; };
const norm=s=>String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[“”"]/g,"").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let timers=[]; const clear=()=>{ timers.forEach(clearInterval); timers=[]; };
function go(n){ clear(); S.step=n; S.stamp=today(); persist(); render(); scrollTo({top:0}); }
const next=(label,n,dis)=>$("button",{class:"btn",disabled:!!dis,on:{click:()=>go(n)}},label);
function render(){
  document.getElementById("bar").style.width=(S.step/(STEPS-1)*100)+"%";
  const app=document.getElementById("app"); app.replaceChildren();
  [welcome,who,plan,wheel,read,speak,concept,practice,done][S.step]().forEach(x=>app.append(x));
}

async function upload(path, blob, type){
  const r=await fetch(SB_URL+"/storage/v1/object/english/"+path,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":type},body:blob});
  if(!r.ok) throw new Error(r.status);
}
const hm=()=>{ const d=new Date(); return String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0"); };

/* 1 */ function welcome(){ return [
  $("h1",{text:"Welcome"}),
  $("p",{class:"muted",text:"Twenty minutes of English, every day."}),
  next("Start",1)]; }

/* 2 */ function who(){
  const g=$("div",{class:"two"});
  for(const id of ["piyus","archita"]) g.append($("button",{class:"name",on:{click:()=>{ if(S.who!==id){ S.ans={}; S.qi=0; S.writing=""; S.sent=false; S.saved=false; S.topic=null; } S.who=id; go(2); }}},NAMES[id]));
  return [$("h2",{text:"Who are you?"}), g]; }

/* 3 */ function plan(){ return [
  $("h2",{text:"Today, "+NAMES[S.who]}),
  $("ol",{class:"plan"},["Spin for a topic","Read for 3 minutes","Speak for 2 minutes","Learn one rule","Answer 15 questions"].map(t=>$("li",{text:t}))),
  next("Spin the wheel",3)]; }

/* 4 */ function wheel(){
  const n=TOPICS.length, seg=360/n;
  const c=$("canvas",{width:600,height:600,"aria-label":"Topic wheel"});
  const box=$("div",{class:"wheel"},c);
  const cs=getComputedStyle(document.documentElement), v=k=>cs.getPropertyValue(k).trim();
  const x=c.getContext("2d"); const R=300;
  for(let i=0;i<n;i++){
    const a0=(i*seg-90)*Math.PI/180, a1=((i+1)*seg-90)*Math.PI/180;
    x.beginPath(); x.moveTo(R,R); x.arc(R,R,R,a0,a1); x.closePath();
    x.fillStyle = i%2? v("--surface") : v("--soft"); x.fill();
    x.strokeStyle=v("--line"); x.lineWidth=2; x.stroke();
    x.save(); x.translate(R,R); x.rotate((a0+a1)/2); x.textAlign="right"; x.fillStyle=v("--ink"); x.font="700 26px "+v("--body");
    x.fillText(TOPICS[i], R-26, 9); x.restore();
  }
  let turned=0;
  const out=$("p",{class:"topic",text:S.topic||" "});
  const go1=next("Next: read",4,!S.topic);
  const spin=$("button",{class:"btn line",on:{click:()=>{
    spin.disabled=true; go1.disabled=true;
    const k=Math.floor(Math.random()*n);
    turned += 360*5 + ((360-(k+0.5)*seg) - (turned%360) + 360)%360;
    c.style.transform="rotate("+turned+"deg)";
    const end=()=>{ S.topic=TOPICS[k]; persist(); out.textContent=S.topic; spin.disabled=false; spin.textContent="Spin again"; go1.disabled=false; };
    matchMedia("(prefers-reduced-motion: reduce)").matches ? end() : setTimeout(end,4100);
  }}}, S.topic?"Spin again":"Spin");
  return [$("h2",{text:"Your topic"}), box, out, spin, go1]; }

/* 5 */ function read(){
  let left=180; const clk=$("div",{class:"clock",text:fmt(left)});
  const b=$("button",{class:"btn line",on:{click:()=>{ clear(); left=180; b.textContent="Restart"; timers.push(setInterval(()=>{ left=Math.max(0,left-1); clk.textContent=fmt(left); if(!left) clear(); },1000)); }}},"Start 3 minutes");
  return [$("h2",{text:"Read and explore"}), $("p",{class:"topic",text:S.topic}), clk, b, next("Next: speak",5)]; }

/* 6 */ let rec=null;
function speak(){
  const clk=$("div",{class:"clock",text:"2:00"});
  const status=$("p",{class:"center small",text:S.sent?"Recording sent ✓":" "});
  const go1=next("Next: today's rule",6);
  const mic=$("button",{class:"mic",on:{click:async()=>{
    if(rec && rec.state==="recording"){ rec.stop(); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ status.textContent="Allow the microphone to record."; return; }
    const mime=["audio/webm","audio/mp4","audio/ogg"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
    const chunks=[]; rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=async()=>{
      clear(); stream.getTracks().forEach(t=>t.stop()); mic.classList.remove("on"); mic.textContent="Record again";
      const type=(rec.mimeType||mime||"audio/webm").split(";")[0];
      const blob=new Blob(chunks,{type}); const ext={"audio/mp4":"m4a","audio/ogg":"ogg"}[type]||"webm";
      const path=S.who+"/"+today()+"/"+hm()+"-speaking."+ext;
      const send=async()=>{ status.textContent="Sending…"; try{ await upload(path,blob,type); S.sent=true; persist(); status.textContent="Recording sent ✓"; }catch(e){ status.replaceChildren("Not sent. ", $("button",{class:"chip",on:{click:send}},"Try again")); } };
      send();
    };
    rec.start(); mic.classList.add("on"); mic.textContent="Stop";
    let left=120; clk.textContent=fmt(left);
    timers.push(setInterval(()=>{ left--; clk.textContent=fmt(Math.max(0,left)); if(left<=0 && rec.state==="recording") rec.stop(); },1000));
  }}}, S.sent?"Record again":"Record");
  return [$("h2",{text:"Speak"}), $("p",{class:"topic",text:S.topic}), clk, mic, status, go1]; }

/* 7 */ function concept(){
  const ex=(yes,no)=>$("div",{class:"ex"},[$("p",{class:"yes",text:"✓ "+yes}), no?$("p",{class:"no",text:no}):null]);
  const a=S.who==="archita";
  return [
    $("h2",{text:"I have done or I did?"}),
    $("div",{class:"rule"},[$("p",{},[$("b",{text:"Finished time → past. "}),"yesterday, last year, in 1949, ago"])]),
    $("div",{class:"rule"},[$("p",{},[$("b",{text:"Time up to now → has / have. "}),"since, for, ever, already, this year"])]),
    ...(a?[ex("The Constitution came into force in 1950.","The Constitution has come into force in 1950."),
           ex("India has amended it many times since 1951."),
           ex("I read the Preamble yesterday.","I have read the Preamble yesterday.")]
         :[ex("I finished the circuit last night.","I have finished the circuit last night."),
           ex("I have worked with ESP32 boards for two years."),
           ex("The test failed on Monday.","The test has failed on Monday.")]),
    next("Next: 15 questions",7)]; }

/* 8 */ function score(){ let n=0; SETS[SETFOR[S.who]].forEach((q,i)=>{ if(S.ans[i]&&S.ans[i].ok===true) n++; }); return n; }
function practice(){
  const set=SETS[SETFOR[S.who]], i=S.qi, q=set[i], a=S.ans[i];
  const out=[$("div",{class:"kind"},[$("span",{text:(i+1)+" / "+set.length}),$("span",{text:q.kind})])];
  const commit=(given,ok)=>{ S.ans[i]={given,ok}; persist(); render(); };
  if(q.t!=="order") out.push($("p",{class:"q",text:q.q}));
  if(q.t==="mcq"){ const b=$("div",{class:"opts"}); q.o.forEach((o,k)=>b.append($("button",{class:"opt"+(a?(k===q.a?" right":(a.given===o?" wrong":"")):""),disabled:!!a,on:{click:()=>commit(o,k===q.a)}},o))); out.push(b); }
  else if(q.t==="error"){ const b=$("div",{class:"parts"}); q.parts.forEach((p,k)=>b.append($("button",{class:"chip"+(a?(k===q.a?" right":(a.given===p?" wrong":"")):""),disabled:!!a,on:{click:()=>commit(p,k===q.a)}},p))); out.push(b); }
  else if(q.t==="fill"){ const inp=$("input",{type:"text",id:"f"+i,autocomplete:"off",autocapitalize:"none",spellcheck:"false",placeholder:"Your answer"}); if(a){inp.value=a.given; inp.disabled=true;}
    const chk=$("button",{class:"btn line",on:{click:()=>{ if(inp.value.trim()) commit(inp.value.trim(), q.acc.includes(norm(inp.value))); }}},"Check");
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") chk.click(); }); out.push(inp); if(!a) out.push(chk); }
  else if(q.t==="order"){ out.push($("p",{class:"q",text:"Put the words in order."}));
    const picked=a?a.given.split(" | "):[]; const tray=$("div",{class:"tray"}), pool=$("div",{class:"parts"});
    const sh=q.words.map((w,k)=>({w,k})).sort((x,y)=>((x.k*7+3)%q.words.length)-((y.k*7+3)%q.words.length));
    const chk=$("button",{class:"btn line",on:{click:()=>commit(picked.join(" | "),picked.join(" ")===q.words.join(" "))}},"Check");
    const draw=()=>{ tray.replaceChildren(); pool.replaceChildren();
      picked.forEach((w,k)=>tray.append($("button",{class:"chip",disabled:!!a,on:{click:()=>{picked.splice(k,1);draw();}}},w)));
      sh.forEach(({w})=>{ if(!picked.includes(w)) pool.append($("button",{class:"chip",disabled:!!a,on:{click:()=>{picked.push(w);draw();}}},w)); });
      chk.disabled=!!a||picked.length!==q.words.length; };
    draw(); out.push(tray,pool); if(!a) out.push(chk); }
  else if(q.t==="write"){ const ta=$("textarea",{id:"w"+i,placeholder:"Two sentences"}); ta.value=a?a.given:S.writing; ta.disabled=!!a; ta.addEventListener("input",()=>{S.writing=ta.value;persist();});
    out.push(ta); if(!a) out.push($("button",{class:"btn line",on:{click:()=>{ if(ta.value.trim().length>7) commit(ta.value.trim(),null); }}},"Done")); }
  if(a){ const right=q.t==="mcq"?q.o[q.a]:q.t==="error"?q.fix:q.t==="order"?q.words.join(" "):q.t==="fill"?q.acc[0]:q.model;
    out.push($("div",{class:"fb"},[ q.t==="write"?$("b",{text:"Example"}):$("b",{class:a.ok?"ok":"no",text:a.ok?"Correct":"Answer: "+right}),
      q.t==="write"?$("p",{text:q.model}):null, $("p",{class:"small",text:q.why})])); }
  const last=i===set.length-1;
  out.push($("button",{class:"btn",disabled:!a,on:{click:()=>{ if(last) go(8); else { S.qi=i+1; persist(); render(); scrollTo({top:0}); } }}},last?"Finish":"Next"));
  return out; }

/* end */ function done(){
  const set=SETS[SETFOR[S.who]];
  const status=$("p",{class:"center small",text:"Sending…"});
  const result={who:S.who,date:today(),topic:S.topic,concept:"present perfect vs simple past",set:SETFOR[S.who],
    score:score(),of:set.length-1,ans:set.map((q,i)=>S.ans[i]?[S.ans[i].given,S.ans[i].ok===true?1:(S.ans[i].ok===false?0:null)]:null),
    writing:(S.ans[set.length-1]||{}).given||"",recordingSent:S.sent};
  const send=async()=>{ status.textContent="Sending…"; try{ await upload(S.who+"/"+today()+"/"+hm()+"-result.json", new Blob([JSON.stringify(result,null,2)],{type:"application/json"}),"application/json"); status.textContent="Saved ✓"; }catch(e){ status.replaceChildren("Not saved. ",$("button",{class:"chip",on:{click:send}},"Try again")); } };
  if(S.saved) status.textContent="Saved ✓"; else { S.saved=true; persist(); send(); }
  return [$("h2",{text:"Done"}), $("div",{class:"clock",text:score()+"/"+(set.length-1)}), status,
    $("button",{class:"btn line",on:{click:()=>{ S={step:1,who:null,topic:null,qi:0,ans:{},writing:"",sent:false,saved:false,stamp:today()}; persist(); render(); }}},"Next person")]; }

render();
</script>
