<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Twenty Minute English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* One quiet column, one step per screen, one accent. */
:root{
  --bg:#FAFAFB; --surface:#FFFFFF; --ink:#16181F; --muted:#6B7080; --line:#E4E6EC;
  --accent:#3046D6; --on-accent:#FFFFFF; --good:#1A7F52; --bad:#C23347; --soft:#F1F2F6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111217; --surface:#1A1C23; --ink:#ECEDF2; --muted:#9A9FB0; --line:#2B2E38;
  --accent:#8FA0FF; --on-accent:#111217; --good:#5BD19C; --bad:#FF8597; --soft:#20232B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111217; --surface:#1A1C23; --ink:#ECEDF2; --muted:#9A9FB0; --line:#2B2E38;
  --accent:#8FA0FF; --on-accent:#111217; --good:#5BD19C; --bad:#FF8597; --soft:#20232B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);height:3px;background:var(--line);z-index:2}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
main{max-width:520px;margin:0 auto;padding-inline:20px;padding-block:40px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.4rem}
h2{font-size:1.7rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:12px;padding:15px 20px;font:700 1rem/1 var(--body);background:var(--accent);color:var(--on-accent);width:100%}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.name{all:unset;cursor:pointer;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:34px 10px;font:700 1.4rem/1 var(--display)}
.name:hover{border-color:var(--accent)}
ol.plan{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.clock{font:700 4.2rem/1 var(--display);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em}
.topic{font:700 1.5rem/1.2 var(--display);text-align:center}
.wheel{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.wheel canvas{width:100%;height:100%;display:block;border-radius:50%;transition:transform 4s cubic-bezier(.15,.85,.2,1)}
.wheel::after{content:"";position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:10px solid transparent;border-top:16px solid var(--accent)}
.mic{all:unset;cursor:pointer;width:112px;height:112px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 1rem/1 var(--body)}
.mic.on{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--bad) 20%,transparent)}}}
@media (prefers-reduced-motion:reduce){.wheel canvas{transition:none}}
.rule{border-left:3px solid var(--accent);padding-left:14px;display:flex;flex-direction:column;gap:6px}
.ex p{margin:0}
.ex .no{color:var(--bad);text-decoration:line-through}
.ex .yes{color:var(--good)}
.q{font-size:1.15rem;font-weight:700}
.kind{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 15px}
.opt.right,.chip.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.wrong,.chip.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.tray{min-height:50px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
textarea{min-height:120px;resize:vertical}
.fb{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}
.center{text-align:center}
/* Where am I, and the way back or past: one row, on every step. */
.where{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav .btn{padding:12px 16px;font-size:.95rem}
ul.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
ol.plan li.now{font-weight:700;color:var(--accent)}
</style>
</head>

<script>
const SB_URL='https://tyusfrpcqeholwwfkvzb.supabase.co', SB_KEY='sb_publishable_VHtdUZlWKyQIIBr_pXpqjg_Qs0Z5aPD';
const DAY=2, CONCEPT="asking questions: the helping verb before the subject";

/* Day 1's sets, kept so each person can retry the ones they got wrong. */
const DAY1 = {

  why:"She takes does, and one not is enough: She doesn't know… (not “doesn't not”)."},

 null,null,null,

 null,
 {t:"mcq", kind:"Making questions", q:"Which question is correct?",
  o:["How this sensor works?","How does this sensor works?","How does this sensor work?","How is this sensor work?"], a:2,
  why:"Does carries the -s, so the main verb stays plain: How does this sensor work?"},
 null,
 {t:"fill", kind:"Comparing", q:"Copper is one of ___ (good) conductors of electricity.", acc:["the best"],

  why:"You carry out (or do) an experiment. You don't make one."}
]};
const REVIEW = {archita:DAY1.constitution.filter(Boolean), piyus:DAY1.engineering.filter(Boolean)};

const Q=(kind,q,o,a,why)=>({t:"mcq",kind,q,o,a,why});

const O=(words,why)=>({t:"order",kind:"Word order",words,why});
const WHICH="Which question is correct?", HV="Helping verb", PP="Past or has/have";
const T = {
"The Constitution":{read:["When was it adopted, and when did it come into force?","One Fundamental Right that matters to you, and why.","One duty every citizen has."],

  F(HV,"___ India become a republic in 1950?",["did"],"A finished past event: Did + subject + plain verb."),

 w:"Do you know your Fundamental Duties? When did India become a republic?"},

 speak:["Describe a device you use every day and how it works.","What have you built or fixed yourself?"],
 qs:[Q("Making questions",WHICH,["What this circuit does?","What does this circuit do?","What does this circuit does?","What is this circuit do?"],1,"Does carries the -s, so do stays plain: What does this circuit do?"),
  O(["Why","did","the motor","stop?"],"Question word, then did, then the subject, then the plain verb."),
  E(["How long","does","the battery","lasts?"],3,"last?","Does carries the -s, so: How long does the battery last?"),

  F(HV,"Where ___ you buy this sensor last week?",["did"],"Last week is finished: did + plain verb."),
  Q(PP,"We ___ this board two days ago.",["have tested","tested","has tested","test"],1,"Two days ago is finished: tested."),
  F(PP,"She ___ (work) at this company since 2022.",["has worked","has been working"],"Since 2022 reaches today: has worked."),

"Technology":{read:["Which piece of technology do you use most, and for what?","How has it changed your parents' lives?","One thing technology makes worse."],

  O(["When","did","you","buy","your phone?"],"Question word, then did, then the subject, then the plain verb."),
  E(["What","you are","watching","on YouTube?"],1,"are you","The helping verb goes before the subject: What are you watching?"),
  F(HV,"___ your phone have a good camera?",["does"],"Your phone is one thing: Does it have…? (have stays plain)"),
  F(HV,"___ you ever used a laptop for coding?",["have"],"Ever means up to now: Have you ever used…?"),
  Q(PP,"I ___ my first smartphone in 2018.",["have got","got","have get","get"],1,"In 2018 is finished: got."),
  F(PP,"Smartphones ___ (change) the way we talk since 2010.",["have changed"],"Since 2010 reaches today, and smartphones is plural: have changed."),
  E(["My brother","has bought","a new laptop","two weeks ago."],1,"bought","Two weeks ago is finished: My brother bought…")],
 w:"Do you use a laptop every day? When did you get your first phone?"},
"Environment":{read:["The biggest environmental problem in your town.","What did you throw away today?","One small thing a person can do every day."],
 speak:["How has the weather where you live changed?","What should the government do about plastic?"],
 qs:[Q("Making questions",WHICH,["Why the rivers are dirty?","Why are the rivers dirty?","Why are dirty the rivers?","Why do the rivers are dirty?"],1,"Are goes before the subject: Why are the rivers dirty?"),
  O(["How much","plastic","do","we","use?"],"Question words, then do, then the subject, then the plain verb."),
  E(["Did","the factory","closed","last year?"],2,"close","Did carries the past: Did the factory close?"),

  E(["The air","has become","very bad","last winter."],1,"became","Last winter is finished: The air became very bad.")],
 w:"Do you use plastic bags? When did it last rain in your town?"},
"Education":{read:["One thing school taught you well.","One thing it never taught you.","Exams or projects: which shows more?"],

 speak:["Tell the story of a film you like, in order.","Which actor have you liked for a long time?"],
 qs:[Q("Making questions",WHICH,["What film you watched last night?","What film did you watch last night?","What film did you watched last night?","What film you did watch last night?"],1,"Did carries the past, the verb stays plain: What film did you watch?"),

"My hometown":{read:["Where is it, and what is it known for?","What has changed there in the last five years?","What do you miss when you are away?"],
 speak:["Describe your hometown to someone who has never been there.","What would you change about it?"],
 qs:[Q("Making questions",WHICH,["Where your hometown is?","Where is your hometown?","Where is your hometown is?","Where does your hometown is?"],1,"Is goes before the subject: Where is your hometown?"),
  O(["What","is","your hometown","famous for?"],"Question word, then is, then the subject."),
  E(["How long","you have","lived","there?"],1,"have you","The helping verb goes before the subject: How long have you lived there?"),
  F(HV,"___ your hometown have a railway station?",["does"],"One town: does, and have stays plain."),
  F(HV,"When ___ you last go home?",["did"],"A finished past event: did + plain verb."),
  Q(PP,"A new bridge ___ in my town in 2022.",["has opened","opened","have opened","opens"],1,"In 2022 is finished: opened."),
  F(PP,"My town ___ (grow) a lot since I was a child.",["has grown"],"Since I was a child reaches today: has grown."),
  E(["My family","has moved","here","in 2010."],1,"moved","In 2010 is finished: My family moved here in 2010.")],
 w:"Do you miss your hometown? When did you last visit it?"}
};
const TOPICS=Object.keys(T);
const writeQ=topic=>({t:"write",kind:"Write it yourself",q:"Write 2 questions you would ask someone about "+topic.toLowerCase()+": one with do or does, one with did.",model:T[topic].w,why:"Helping verb first, then the subject, then the plain verb."});
const setFor=topic=>T[topic].qs.concat([writeQ(topic)]);
const NAMES = {piyus:"Piyus", archita:"Archita"};
const STEP_NAMES=["Welcome","Your name","Today's plan","Topic wheel","Read","Speak","Fix Day 1","Today's rule","Questions","Done"];
const STEPS=STEP_NAMES.length;

const fresh=()=>({step:0, who:null, topic:null, qi:0, ri:0, ans:{}, rev:{}, sent:false, saved:false, stamp:null});
let S=fresh();
const KEY="tme3";
const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
try{ const v=JSON.parse(localStorage.getItem(KEY)||"null"); if(v && v.stamp===today()) S=Object.assign(S,v); }catch(e){}
function today(){ return new Date().toLocaleDateString("en-CA"); }
const lastTopic=()=>{ try{ return (JSON.parse(localStorage.getItem("tme-last")||"{}"))[S.who]; }catch(e){ return null; } };
const keepTopic=()=>{ try{ const m=JSON.parse(localStorage.getItem("tme-last")||"{}"); m[S.who]=S.topic; localStorage.setItem("tme-last",JSON.stringify(m)); }catch(e){} };

const $=(t,a={},k=[])=>{ const e=document.createElement(t); for(const [x,v] of Object.entries(a)){ if(x==="text") e.textContent=v; else if(x==="on") for(const [ev,f] of Object.entries(v)) e.addEventListener(ev,f); else if(v!==false&&v!=null) e.setAttribute(x,v===true?"":v); } for(const c of [].concat(k)) if(c!=null) e.append(c); return e; };
const norm=s=>String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[“”"]/g,"").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let timers=[]; const clear=()=>{ timers.forEach(clearInterval); timers=[]; };
function go(n){ clear(); if(rec && rec.state==="recording") rec.stop(); S.step=Math.max(0,Math.min(STEPS-1,n)); S.stamp=today(); persist(); render(); scrollTo({top:0}); }
const next=(label,n,dis)=>$("button",{class:"btn",disabled:!!dis,on:{click:()=>go(n)}},label);
/* Back and Skip: the same row on every step after the name. Skip moves on without doing the step. */
const nav=(back,skip)=>$("div",{class:"nav"},[
  $("button",{class:"btn line",disabled:!back,on:{click:back||(()=>{})}},"← Back"),
  $("button",{class:"btn line",disabled:!skip,on:{click:skip||(()=>{})}},"Skip →")]);
const where=()=>$("div",{class:"where"},[$("span",{text:"Step "+(S.step+1)+" of "+STEPS+" · "+STEP_NAMES[S.step]}),$("span",{text:S.who?NAMES[S.who]+(S.topic?" · "+S.topic:""):""})]);
function render(){
  document.getElementById("bar").style.width=(S.step/(STEPS-1)*100)+"%";
  const app=document.getElementById("app"); app.replaceChildren();
  if(S.step>1 && !S.who){ S.step=1; }
  if(S.step>3 && !S.topic){ S.step=3; }
  if(S.step>0) app.append(where());
  [welcome,who,plan,wheel,read,speak,fix,concept,practice,done][S.step]().forEach(x=>app.append(x));
}

async function upload(path, blob, type){
  const r=await fetch(SB_URL+"/storage/v1/object/english/"+path,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":type},body:blob});
  if(!r.ok) throw new Error(r.status);
}
const hm=()=>{ const d=new Date(); return String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0"); };
/* A countdown on the wall clock, so a locked screen or a background tab cannot stretch it. */
function countdown(secs, clk, onEnd){ const end=Date.now()+secs*1000;
  const tick=()=>{ const left=Math.max(0,Math.ceil((end-Date.now())/1000)); clk.textContent=fmt(left); if(!left){ clear(); onEnd&&onEnd(); } };
  tick(); timers.push(setInterval(tick,250)); return end; }

/* 1 */ function welcome(){ return [
  $("h1",{text:"Welcome"}),
  $("p",{class:"muted",text:"Twenty minutes of English, every day. Day "+DAY+"."}),
  next("Start",1)]; }

/* 2 */ function who(){
  const g=$("div",{class:"two"});
  for(const id of ["piyus","archita"]) g.append($("button",{class:"name",on:{click:()=>{ if(S.who!==id){ const k=fresh(); k.who=id; S=k; } go(2); }}},NAMES[id]));
  return [$("h2",{text:"Who are you?"}), g, nav(()=>go(0),null)]; }

/* 3 */ function plan(){
  const items=["Spin for a topic","Read for 3 minutes","Speak for 2 minutes","Fix your Day 1 mistakes","Learn today's rule","Answer 9 questions on your topic"];
  return [
  $("h2",{text:"Today, "+NAMES[S.who]}),
  $("ol",{class:"plan"},items.map(t=>$("li",{text:t}))),
  $("p",{class:"small",text:"Back and Skip are at the bottom of every step."}),
  next("Spin the wheel",3), nav(()=>go(1),()=>go(3))]; }

/* 4 */ function wheel(){
  const n=TOPICS.length, seg=360/n;
  const c=$("canvas",{width:600,height:600,"aria-label":"Topic wheel"});
  const box=$("div",{class:"wheel"},c);
  const cs=getComputedStyle(document.documentElement), v=k=>cs.getPropertyValue(k).trim();
  const x=c.getContext("2d"); const R=300;
  for(let i=0;i<n;i++){
    const a0=(i*seg-90)*Math.PI/180, a1=((i+1)*seg-90)*Math.PI/180;
    x.beginPath(); x.moveTo(R,R); x.arc(R,R,R,a0,a1); x.closePath();
    x.fillStyle = i%2? v("--surface") : v("--soft"); x.fill();
    x.strokeStyle=v("--line"); x.lineWidth=2; x.stroke();
    x.save(); x.translate(R,R); x.rotate((a0+a1)/2); x.textAlign="right"; x.fillStyle=v("--ink"); x.font="700 26px "+v("--body");
    x.fillText(TOPICS[i], R-26, 9); x.restore();
  }
  let turned=0;
  const out=$("p",{class:"topic",text:S.topic||" "});
  const go1=next("Next: read",4,!S.topic);
  const pick=()=>{ const last=lastTopic(); const pool=TOPICS.map((t,i)=>i).filter(i=>TOPICS[i]!==last && TOPICS[i]!==S.topic); return pool[Math.floor(Math.random()*pool.length)]; };
  const land=k=>{ S.topic=TOPICS[k]; S.ans={}; S.qi=0; keepTopic(); persist(); out.textContent=S.topic; };
  const spin=$("button",{class:"btn line",on:{click:()=>{
    spin.disabled=true; go1.disabled=true;
    const k=pick();
    turned += 360*5 + ((360-(k+0.5)*seg) - (turned%360) + 360)%360;
    c.style.transform="rotate("+turned+"deg)";
    const end=()=>{ land(k); spin.disabled=false; spin.textContent="Spin again"; go1.disabled=false; };
    matchMedia("(prefers-reduced-motion: reduce)").matches ? end() : setTimeout(end,4100);
  }}}, S.topic?"Spin again":"Spin");
  return [$("h2",{text:"Your topic"}), $("p",{class:"small center",text:"Any topic can come up, for either of you."}), box, out, spin, go1,
    nav(()=>go(2),()=>{ if(!S.topic) land(pick()); go(4); })]; }

/* 5 */ function read(){
  const clk=$("div",{class:"clock",text:"3:00"});
  const b=$("button",{class:"btn line",on:{click:()=>{ clear(); b.textContent="Restart"; countdown(180,clk); }}},"Start 3 minutes");
  return [$("h2",{text:"Read and explore"}), $("p",{class:"topic",text:S.topic}),
    $("p",{class:"small",text:"Search it, or just think. Find something to say about:"}),
    $("ul",{class:"pts"},T[S.topic].read.map(t=>$("li",{text:t}))),
    clk, b, next("Next: speak",5), nav(()=>go(3),()=>go(5))]; }

/* 6 */ let rec=null;
function speak(){
  const clk=$("div",{class:"clock",text:"2:00"});
  const status=$("p",{class:"center small",text:S.sent?"Recording sent ✓":"Speak close to the phone, in a quiet room."});
  const mic=$("button",{class:"mic",on:{click:async()=>{
    if(rec && rec.state==="recording"){ rec.stop(); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ status.textContent="Allow the microphone to record."; return; }
    const mime=["audio/webm","audio/mp4","audio/ogg"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
    const chunks=[]; const r=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); rec=r;
    let end=0;
    r.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); if(end && Date.now()>=end && r.state==="recording") r.stop(); };
    r.onstop=async()=>{
      clear(); stream.getTracks().forEach(t=>t.stop()); mic.classList.remove("on"); mic.textContent="Record again";
      const type=(r.mimeType||mime||"audio/webm").split(";")[0];
      const blob=new Blob(chunks,{type}); const ext={"audio/mp4":"m4a","audio/ogg":"ogg"}[type]||"webm";
      const path=S.who+"/"+today()+"/"+hm()+"-speaking."+ext;
      const send=async()=>{ status.textContent="Sending…"; try{ await upload(path,blob,type); S.sent=true; persist(); status.textContent="Recording sent ✓"; }catch(e){ status.replaceChildren("Not sent. ", $("button",{class:"chip",on:{click:send}},"Try again")); } };
      send();
    };
    r.start(1000); mic.classList.add("on"); mic.textContent="Stop";
    end=countdown(120,clk,()=>{ if(r.state==="recording") r.stop(); });
  }}}, S.sent?"Record again":"Record");
  return [$("h2",{text:"Speak"}), $("p",{class:"topic",text:S.topic}),
    $("ul",{class:"pts"},T[S.topic].speak.map(t=>$("li",{text:t}))),
    clk, mic, status, next("Next: fix Day 1",6), nav(()=>go(4),()=>go(6))]; }

/* A round of questions, shared by Fix Day 1 and the topic questions. */
function quiz(set, store, idx, back, finish){
  const i=S[idx], q=set[i], a=S[store][i];
  const out=[$("div",{class:"kind"},[$("span",{text:(i+1)+" / "+set.length}),$("span",{text:q.kind})])];
  const commit=(given,ok)=>{ S[store][i]={given,ok}; persist(); render(); };
  const move=d=>{ S[idx]=i+d; persist(); render(); scrollTo({top:0}); };
  if(q.t!=="order") out.push($("p",{class:"q",text:q.q}));
  if(q.t==="mcq"){ const b=$("div",{class:"opts"}); q.o.forEach((o,k)=>b.append($("button",{class:"opt"+(a?(k===q.a?" right":(a.given===o?" wrong":"")):""),disabled:!!a,on:{click:()=>commit(o,k===q.a)}},o))); out.push(b); }
  else if(q.t==="error"){ const b=$("div",{class:"parts"}); q.parts.forEach((p,k)=>b.append($("button",{class:"chip"+(a?(k===q.a?" right":(a.given===p?" wrong":"")):""),disabled:!!a,on:{click:()=>commit(p,k===q.a)}},p))); out.push(b); }
  else if(q.t==="fill"){ const inp=$("input",{type:"text",id:"f"+i,autocomplete:"off",autocapitalize:"none",spellcheck:"false",placeholder:"Your answer"}); if(a){inp.value=a.given; inp.disabled=true;}
    const chk=$("button",{class:"btn line",on:{click:()=>{ if(inp.value.trim()) commit(inp.value.trim(), q.acc.includes(norm(inp.value))); }}},"Check");
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") chk.click(); }); out.push(inp); if(!a) out.push(chk); }
  else if(q.t==="order"){ out.push($("p",{class:"q",text:"Put the words in order."}));
    const picked=a&&a.given?a.given.split(" | "):[]; const tray=$("div",{class:"tray"}), pool=$("div",{class:"parts"});
    const sh=q.words.map((w,k)=>({w,k})).sort((x,y)=>((x.k*7+3)%q.words.length)-((y.k*7+3)%q.words.length));
    const chk=$("button",{class:"btn line",on:{click:()=>commit(picked.join(" | "),picked.join(" ")===q.words.join(" "))}},"Check");
    const draw=()=>{ tray.replaceChildren(); pool.replaceChildren();
      picked.forEach((w,k)=>tray.append($("button",{class:"chip",disabled:!!a,on:{click:()=>{picked.splice(k,1);draw();}}},w)));
      sh.forEach(({w})=>{ if(!picked.includes(w)) pool.append($("button",{class:"chip",disabled:!!a,on:{click:()=>{picked.push(w);draw();}}},w)); });
      chk.disabled=!!a||picked.length!==q.words.length; };
    draw(); out.push(tray,pool); if(!a) out.push(chk); }
  else if(q.t==="write"){ const ta=$("textarea",{id:"w"+i,placeholder:"Two questions"}); ta.value=a?a.given:""; ta.disabled=!!a;
    out.push(ta); if(!a) out.push($("button",{class:"btn line",on:{click:()=>{ if(ta.value.trim().length>7) commit(ta.value.trim(),null); }}},"Done")); }
  if(a){ const right=q.t==="mcq"?q.o[q.a]:q.t==="error"?q.fix:q.t==="order"?q.words.join(" "):q.t==="fill"?q.acc[0]:q.model;
    const head=a.ok==="skip"?"Skipped. Answer: "+right:q.t==="write"?"Example":a.ok?"Correct":"Answer: "+right;
    out.push($("div",{class:"fb"},[ $("b",{class:a.ok===true?"ok":(q.t==="write"&&a.ok!=="skip"?"":"no"),text:head}),
      q.t==="write"&&a.ok!=="skip"?$("p",{text:q.model}):null, $("p",{class:"small",text:q.why})])); }
  const last=i===set.length-1;
  out.push($("button",{class:"btn",disabled:!a,on:{click:()=>{ if(last) finish(); else move(1); }}},last?"Finish":"Next"));
  out.push(nav(()=>{ if(i>0) move(-1); else back(); },
               ()=>{ if(!a){ S[store][i]={given:"",ok:"skip"}; persist(); } if(last) finish(); else move(1); }));
  return out; }

/* 7 */ function fix(){
  const set=REVIEW[S.who];
  const intro=[$("h2",{text:"Fix Day 1"}),$("p",{class:"small",text:"The "+set.length+" you got wrong on Day 1. Try them again."})];
  return intro.concat(quiz(set,"rev","ri",()=>go(5),()=>go(7))); }

/* 8 */ function concept(){
  const ex=(yes,no)=>$("div",{class:"ex"},[$("p",{class:"yes",text:"✓ "+yes}), no?$("p",{class:"no",text:no}):null]);
  return [
    $("h2",{text:"How to ask a question"}),
    $("div",{class:"rule"},[$("p",{},[$("b",{text:"The helping verb goes before the subject. "}),"do, does, did, is, are, was, have, has"])]),
    $("div",{class:"rule"},[$("p",{},[$("b",{text:"After do, does or did, the verb stays plain. "}),"Did you go? never Did you went? Does it work? never Does it works?"])]),
    ex("How does this sensor work?","How this sensor works?"),
    ex("When was the Constitution adopted?","When the Constitution was adopted?"),
    ex("What did you eat today?","What did you ate today?"),
    $("p",{class:"small",text:"Both of you got this wrong on Day 1, and both got “has adopted / have finished” wrong too. Those come back in the questions."}),
    next("Next: 9 questions",8), nav(()=>{ S.ri=Math.max(0,REVIEW[S.who].length-1); go(6); },()=>go(8))]; }

/* 9 */ function score(set,store){ let n=0; set.forEach((q,i)=>{ if(S[store][i]&&S[store][i].ok===true) n++; }); return n; }
function practice(){
  const set=setFor(S.topic);
  return [$("p",{class:"topic",text:S.topic})].concat(quiz(set,"ans","qi",()=>go(7),()=>go(9))); }

/* end */ function done(){
  const set=setFor(S.topic), rset=REVIEW[S.who];
  const pack=(qs,store)=>qs.map((q,i)=>{ const a=S[store][i]; return a?[a.given, a.ok===true?1:(a.ok===false?0:null)]:null; });
  const status=$("p",{class:"center small",text:"Sending…"});
  const result={who:S.who,date:today(),day:DAY,topic:S.topic,concept:CONCEPT,
    score:score(set,"ans"),of:set.length-1,ans:pack(set,"ans"),
    review:{score:score(rset,"rev"),of:rset.length,ans:pack(rset,"rev")},
    skipped:Object.values(S.ans).concat(Object.values(S.rev)).filter(a=>a.ok==="skip").length,
    writing:(S.ans[set.length-1]||{}).given||"",recordingSent:S.sent};
  const send=async()=>{ status.textContent="Sending…"; try{ await upload(S.who+"/"+today()+"/"+hm()+"-result.json", new Blob([JSON.stringify(result,null,2)],{type:"application/json"}),"application/json"); status.textContent="Saved ✓"; }catch(e){ status.replaceChildren("Not saved. ",$("button",{class:"chip",on:{click:send}},"Try again")); } };
  if(S.saved) status.textContent="Saved ✓"; else { S.saved=true; persist(); send(); }
  return [$("h2",{text:"Done"}), $("div",{class:"clock",text:result.score+"/"+result.of}),
    $("p",{class:"center small",text:"Fix Day 1: "+result.review.score+"/"+result.review.of}), status,
    $("button",{class:"btn line",on:{click:()=>{ S=fresh(); S.step=1; S.stamp=today(); persist(); render(); }}},"Next person"),
    nav(()=>{ S.qi=set.length-1; go(8); },null)]; }

render();
</script>
